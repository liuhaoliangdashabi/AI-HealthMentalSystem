spring:
  application:
    name: analytics-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  cloud:
    nacos:
      discovery:
        ip: 127.0.0.1
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: dev
    sentinel:
      transport:
        dashboard: localhost:8858
      datasource:
        flow:
          nacos:
            server-addr: 127.0.0.1:8848
            namespace: dev
            group-id: dev
            data-id: analytics-sentinel-degrade.json
            data-type: json
            rule-type: degrade
      eager: true
  data:
    redis:
      sentinel:
        master: mymaster
        nodes: 127.0.0.1:26379
      timeout: 3000ms
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24小时（毫秒）
  header: token  # token头部名称
server:
  port: 8070
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: 10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|127\.\d+\.\d+\.\d+
#白名单：只有列出来的包开 debug
#新增包且里面写了 log.debug，记得回来补一行
logging:
  level:
    org.example.aispringboot.controller: debug
    org.example.aispringboot.service: debug
    org.example.aispringboot.util: debug
internal:
  diary-service:
    url: http://diary-service
  consult-service:
    url: http://consult-service
  user-service:
    url: http://user-service
---
#模拟生产环境
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    org.example.aispringboot: info
