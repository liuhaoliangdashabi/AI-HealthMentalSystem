server:
  port: 8060

spring:
  application:
    name: file-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: dev
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: dev
  codec:
    max-in-memory-size: 30MB
  config:
    import:
      - optional:nacos:file-service.yaml
  data:
    redis:
      sentinel:
        master: mymaster
        nodes: 127.0.0.1:26379
      timeout: 3000ms
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/mental_health_file?characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&timeZone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 30MB

logging:
  level:
    org.example.fileservice.task: debug

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.example.fileservice.entity

oss:
  region: cn-beijing
  bucket: mental-health-ai-assistant