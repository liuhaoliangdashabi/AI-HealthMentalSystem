jwt:
  secret: ${JWT_SECRET}
  header: token
server:
  port: 9000
spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: knowledge-service
              uri: lb://knowledge-service
              predicates:
                - Path=/api/knowledge/**
            - id: diary-service
              uri: lb://diary-service
              predicates:
                - Path=/api/emotion-diary/**
            - id: web
              uri: http://127.0.0.1:8080
              predicates:
                - Path=/api/**
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: dev
        group: dev
        register-enabled: false