spring.application.name=demo

# 端口 8080 被本机一个叫 ApplicationWebServer 的第三方软件占了，换个端口跑。
# 后面所有练习的 URL 都用 8081。
server.port=8081

# ==================== Redis 连接配置 ====================

# 【坑点 1】前缀是 spring.data.redis，不是 spring.redis。
# 网上大量中文老教程写 spring.redis.host，那是 Spring Boot 2.x 的写法。
# 在 Boot 3 / 4 里这个前缀已经失效 —— 而且它不报错，只是静默忽略，
# 于是你以为连的是自己的库，其实连的还是默认的 localhost:6379。极难排查。
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# 库编号，等价于 redis-cli 里敲 SELECT 0。
# Redis 默认 16 个库（0~15），库与库之间 key 互不可见，常用来隔离环境。
spring.data.redis.database=0

# 连接超时
spring.data.redis.timeout=3s

# 【坑点 2】没有密码时，password 这一行要整个不写。
# 一旦写了 spring.data.redis.password=（哪怕是空值），
# Lettuce 就会真的发一条 AUTH 命令，而没设密码的 Redis 会回
# "ERR Client sent AUTH, but no password is set"，直接连接失败。
# 你的 Redis 没密码，所以这里刻意不写这一行。
